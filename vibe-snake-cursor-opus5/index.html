<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Vibe Snake 3310 - Cursor Opus 5 Edition</title>
<link rel="stylesheet" href="style.css" />
<script defer src="game.js"></script>
</head>
<body>

<h1>Vibe Snake 3310 - Cursor Opus 5 Edition</h1>
<p class="subtitle">3310 &middot; snake ii</p>

<!-- The phone is the photo; every overlay below is positioned in % of it (see style.css). -->
<div class="phone">
  <img class="photo" src="Nokia_3310.png" alt="Nokia 3310" draggable="false" />

  <div class="lcd">
    <div class="status">
      <span>SCORE <b id="score">0</b></span>
      <span>HI <b id="best">0</b></span>
    </div>
    <canvas id="board" width="340" height="200" aria-label="Snake game board"></canvas>

    <div class="overlay" id="overlay">
      <div class="big" id="overlayTitle">SNAKE II</div>
      <div id="overlayBody">Eat the dots.<br />Don't bite yourself.</div>
      <div class="blink" id="overlayHint">PRESS 5</div>
    </div>
  </div>

  <!-- Invisible hit areas sitting on the phone's real keys. -->
  <button class="key k2" data-dir="up"    aria-label="Up (key 2)"></button>
  <button class="key k4" data-dir="left"  aria-label="Left (key 4)"></button>
  <button class="key k6" data-dir="right" aria-label="Right (key 6)"></button>
  <button class="key k8" data-dir="down"  aria-label="Down (key 8)"></button>
  <button class="key k5" data-act="start" aria-label="Start or pause (key 5)"></button>
  <button class="key soft kc" data-act="reset" aria-label="Clear high score (C)"></button>
  <button class="key soft kr" data-act="mute" aria-label="Toggle sound"></button>
</div>

<p class="hints">
  <b>2 4 6 8</b> or <b>arrows</b> steer &nbsp;&middot;&nbsp; <b>5</b> / <b>space</b> start &amp; pause<br />
  <b>C</b> clears the high score &nbsp;&middot;&nbsp; <b>M</b> or the right key mutes &nbsp;&middot;&nbsp; swipe the screen on touch
</p>

</body>
</html>
