<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Vibe Snake 3310 - Cursor Opus 5 Edition</title>
<style>
  :root {
    --lcd: #9ebd4e;
    --lcd-dim: #92b148;
    --ink: #1f2a12;
    --shell: #3a4550;
    --shell-dark: #2b333c;
    --shell-light: #4d5a68;
    --key: #4a5663;
    --key-face: #5a6875;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(circle at 50% 0%, #2f3a45, #14181d 70%);
    color: #dfe6ec;
    font-family: "Lucida Console", "DejaVu Sans Mono", Menlo, monospace;
    -webkit-font-smoothing: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 24px 16px 40px;
  }

  h1 {
    margin: 0;
    font-size: clamp(15px, 4vw, 24px);
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    color: #cfe08a;
    text-shadow: 0 0 12px rgba(158, 189, 78, .45);
  }

  .subtitle {
    margin: -10px 0 0;
    font-size: 11px;
    letter-spacing: 3px;
    color: #7c8b99;
    text-transform: uppercase;
  }

  /* ---------- phone shell ---------- */
  .phone {
    width: 320px;
    max-width: 100%;
    padding: 18px 18px 22px;
    border-radius: 34px 34px 46px 46px;
    background: linear-gradient(160deg, var(--shell-light), var(--shell) 35%, var(--shell-dark));
    box-shadow:
      inset 0 2px 0 rgba(255, 255, 255, .18),
      inset 0 -3px 6px rgba(0, 0, 0, .5),
      0 22px 45px rgba(0, 0, 0, .55);
  }

  .brand {
    text-align: center;
    font-size: 11px;
    letter-spacing: 5px;
    color: #c3ccd4;
    opacity: .75;
    margin-bottom: 12px;
  }

  /* ---------- screen ---------- */
  .screen {
    padding: 10px;
    border-radius: 8px;
    background: #1d2129;
    box-shadow: inset 0 3px 8px rgba(0, 0, 0, .7);
  }

  .lcd {
    position: relative;
    background: var(--lcd);
    border: 2px solid #6f8a35;
    border-radius: 3px;
    padding: 4px;
    color: var(--ink);
    overflow: hidden;
  }

  .lcd::after { /* subtle LCD scanline texture */
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .07) 0 1px, transparent 1px 3px);
  }

  .status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 1px 3px 4px;
    border-bottom: 2px dotted rgba(31, 42, 18, .45);
    margin-bottom: 4px;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    background: rgba(158, 189, 78, .93);
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 1px;
    padding: 8px;
  }

  .overlay[hidden] { display: none; }
  .overlay .big { font-size: 15px; font-weight: bold; letter-spacing: 2px; }
  .overlay .blink { animation: blink 1s steps(1, end) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- keypad ---------- */
  .keys {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
  }

  button {
    font: inherit;
    color: #e8eef3;
    background: linear-gradient(180deg, var(--key-face), var(--key));
    border: none;
    border-radius: 12px;
    padding: 10px 0;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 3px 0 #232a31;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  button:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 1px 0 #232a31; }

  .soft { font-size: 10px; letter-spacing: 1px; padding: 8px 6px; }

  .dpad {
    width: 118px;
    height: 118px;
    display: grid;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    gap: 4px;
  }

  .dpad button { font-size: 14px; border-radius: 10px; }
  .dpad .up    { grid-area: 1 / 2; }
  .dpad .left  { grid-area: 2 / 1; }
  .dpad .ok    { grid-area: 2 / 2; font-size: 9px; letter-spacing: 1px; }
  .dpad .right { grid-area: 2 / 3; }
  .dpad .down  { grid-area: 3 / 2; }

  .hints {
    font-size: 10px;
    line-height: 1.7;
    letter-spacing: 1px;
    color: #7c8b99;
    text-align: center;
    max-width: 340px;
  }

  .hints b { color: #a8b8c4; font-weight: normal; }
</style>
</head>
<body>

<h1>Vibe Snake 3310 - Cursor Opus 5 Edition</h1>
<p class="subtitle">3310 &middot; snake ii</p>

<div class="phone">
  <div class="brand">NOKIA</div>

  <div class="screen">
    <div class="lcd">
      <div class="status">
        <span>SCORE <b id="score">0</b></span>
        <span>HI <b id="best">0</b></span>
      </div>
      <canvas id="board" width="240" height="180" aria-label="Snake game board"></canvas>

      <div class="overlay" id="overlay">
        <div class="big" id="overlayTitle">SNAKE II</div>
        <div id="overlayBody">Eat the dots.<br />Don't bite yourself.</div>
        <div class="blink" id="overlayHint">PRESS OK / SPACE</div>
      </div>
    </div>
  </div>

  <div class="keys">
    <button class="soft" data-act="start">START</button>
    <div class="dpad">
      <button class="up"    data-dir="up"    aria-label="Up">&#9650;</button>
      <button class="left"  data-dir="left"  aria-label="Left">&#9664;</button>
      <button class="ok"    data-act="start" aria-label="OK">OK</button>
      <button class="right" data-dir="right" aria-label="Right">&#9654;</button>
      <button class="down"  data-dir="down"  aria-label="Down">&#9660;</button>
    </div>
    <button class="soft" data-act="reset">RESET&nbsp;HI</button>
  </div>
</div>

<p class="hints">
  <b>ARROWS / WASD</b> steer &nbsp;&middot;&nbsp; <b>SPACE</b> start &amp; pause &nbsp;&middot;&nbsp; <b>M</b> mute<br />
  swipe on the screen to steer on touch devices
</p>

<script>
"use strict";

/* Tweak these to change how the game feels. */
const CONFIG = {
  cols: 24,            // board width in cells
  rows: 18,            // board height in cells
  startLength: 4,
  startMs: 130,        // ms per step at score 0
  minMs: 55,           // fastest step
  speedUpPerFood: 3,   // ms shaved off each step per food eaten
  growPerFood: 2,      // cells added per food
  wrapWalls: false,    // true = walk through walls instead of dying
  storageKey: "vibe-snake-3310-best",
};

const COLOR = { lcd: "#9ebd4e", ink: "#1f2a12", dim: "rgba(31,42,18,.18)" };

const DIRS = {
  up:    { x:  0, y: -1 },
  down:  { x:  0, y:  1 },
  left:  { x: -1, y:  0 },
  right: { x:  1, y:  0 },
};

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const els = {
  score: document.getElementById("score"),
  best: document.getElementById("best"),
  overlay: document.getElementById("overlay"),
  title: document.getElementById("overlayTitle"),
  body: document.getElementById("overlayBody"),
  hint: document.getElementById("overlayHint"),
};

const cell = 10;
canvas.width = CONFIG.cols * cell;
canvas.height = CONFIG.rows * cell;

let state = null;   // set by newGame()
let muted = false;
let best = loadBest();
let lastStep = 0;
let phase = "idle";  // idle | playing | paused | over

function loadBest() {
  try { return Number(localStorage.getItem(CONFIG.storageKey)) || 0; }
  catch { return 0; }
}

function saveBest(value) {
  try { localStorage.setItem(CONFIG.storageKey, String(value)); } catch {}
}

function newGame() {
  const midY = Math.floor(CONFIG.rows / 2);
  const snake = [];
  for (let i = 0; i < CONFIG.startLength; i++) snake.push({ x: 4 - i, y: midY });

  state = {
    snake,
    dir: DIRS.right,
    queue: [],
    grow: 0,
    score: 0,
    food: null,
    tick: 0,
  };
  state.food = spawnFood();
  lastStep = 0;
  render();
  updateStatus();
}

function spawnFood() {
  const taken = new Set(state.snake.map(p => p.x + "," + p.y));
  const free = [];
  for (let y = 0; y < CONFIG.rows; y++) {
    for (let x = 0; x < CONFIG.cols; x++) {
      if (!taken.has(x + "," + y)) free.push({ x, y });
    }
  }
  return free.length ? free[(Math.random() * free.length) | 0] : null;
}

function stepMs() {
  const eaten = state.score;
  return Math.max(CONFIG.minMs, CONFIG.startMs - eaten * CONFIG.speedUpPerFood);
}

function turn(name) {
  const next = DIRS[name];
  if (!next) return;
  const last = state.queue.length ? state.queue[state.queue.length - 1] : state.dir;
  if (last.x === -next.x && last.y === -next.y) return;  // no instant 180s
  if (last.x === next.x && last.y === next.y) return;
  if (state.queue.length < 3) state.queue.push(next);
  if (phase === "idle") start();
}

function step() {
  if (state.queue.length) state.dir = state.queue.shift();

  const head = state.snake[0];
  let x = head.x + state.dir.x;
  let y = head.y + state.dir.y;

  if (CONFIG.wrapWalls) {
    x = (x + CONFIG.cols) % CONFIG.cols;
    y = (y + CONFIG.rows) % CONFIG.rows;
  } else if (x < 0 || y < 0 || x >= CONFIG.cols || y >= CONFIG.rows) {
    return gameOver();
  }

  const tailFree = state.grow === 0;  // tail moves away this step
  const hitSelf = state.snake.some((p, i) =>
    p.x === x && p.y === y && !(tailFree && i === state.snake.length - 1));
  if (hitSelf) return gameOver();

  state.snake.unshift({ x, y });

  if (state.food && x === state.food.x && y === state.food.y) {
    state.score++;
    state.grow += CONFIG.growPerFood;
    state.food = spawnFood();
    beep(880, 0.05);
    updateStatus();
  }

  if (state.grow > 0) state.grow--;
  else state.snake.pop();

  state.tick++;
  render();
}

/* ---------- drawing ---------- */

function render() {
  ctx.fillStyle = COLOR.lcd;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!CONFIG.wrapWalls) {
    ctx.strokeStyle = COLOR.dim;
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);
  }

  if (!state) return;

  if (state.food && state.tick % 8 < 6) drawFood(state.food);

  ctx.fillStyle = COLOR.ink;
  state.snake.forEach((p, i) => {
    const pad = i === 0 ? 0 : 1;
    ctx.fillRect(p.x * cell + pad, p.y * cell + pad, cell - pad * 2, cell - pad * 2);
    if (i > 0) {  // hollow body segment, like the original LCD sprite
      ctx.fillStyle = COLOR.lcd;
      ctx.fillRect(p.x * cell + 4, p.y * cell + 4, cell - 8, cell - 8);
      ctx.fillStyle = COLOR.ink;
    }
  });
}

function drawFood(food) {
  const cx = food.x * cell;
  const cy = food.y * cell;
  ctx.fillStyle = COLOR.ink;
  ctx.fillRect(cx + 4, cy + 1, 2, cell - 2);
  ctx.fillRect(cx + 1, cy + 4, cell - 2, 2);
}

/* ---------- game flow ---------- */

function updateStatus() {
  els.score.textContent = state ? state.score : 0;
  els.best.textContent = best;
}

function showOverlay(title, body, hint) {
  els.title.textContent = title;
  els.body.innerHTML = body;
  els.hint.textContent = hint;
  els.overlay.hidden = false;
}

function start() {
  if (phase === "playing") return;
  if (phase === "over" || !state) newGame();
  phase = "playing";
  els.overlay.hidden = true;
  lastStep = performance.now();
}

function pause() {
  if (phase !== "playing") return;
  phase = "paused";
  showOverlay("PAUSED", "Score " + state.score, "PRESS OK / SPACE");
}

function togglePause() {
  if (phase === "playing") pause();
  else start();
}

function gameOver() {
  phase = "over";
  beep(160, 0.18, "square");
  const record = state.score > best;
  if (record) { best = state.score; saveBest(best); }
  updateStatus();
  showOverlay("GAME OVER", record
    ? "NEW HIGH SCORE!<br />" + state.score
    : "Score " + state.score + "<br />Best " + best, "PRESS OK / SPACE");
}

function loop(now) {
  if (phase === "playing" && now - lastStep >= stepMs()) {
    lastStep = now;
    step();
  }
  requestAnimationFrame(loop);
}

/* ---------- sound ---------- */

let audio = null;
function beep(freq, seconds, type = "sine") {
  if (muted) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.06, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + seconds);
    osc.connect(gain).connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + seconds);
  } catch {}
}

/* ---------- input ---------- */

const KEYS = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right",
};

addEventListener("keydown", (e) => {
  const dir = KEYS[e.key] || KEYS[e.key.toLowerCase()];
  if (dir) {
    e.preventDefault();
    if (phase === "over" || phase === "paused") start();
    else turn(dir);
    return;
  }
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); togglePause(); }
  if (e.key.toLowerCase() === "m") muted = !muted;
});

document.querySelectorAll("[data-dir]").forEach(btn => {
  const fire = (e) => {
    e.preventDefault();
    if (phase === "over" || phase === "paused") start();
    else turn(btn.dataset.dir);
  };
  btn.addEventListener("pointerdown", fire);
});

document.querySelectorAll("[data-act]").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.dataset.act === "start") togglePause();
    else { best = 0; saveBest(0); updateStatus(); }
  });
});

/* swipe to steer */
let touchStart = null;
const lcd = document.querySelector(".lcd");
lcd.addEventListener("pointerdown", (e) => { touchStart = { x: e.clientX, y: e.clientY }; });
lcd.addEventListener("pointerup", (e) => {
  if (!touchStart) return;
  const dx = e.clientX - touchStart.x;
  const dy = e.clientY - touchStart.y;
  touchStart = null;
  if (Math.abs(dx) < 18 && Math.abs(dy) < 18) { togglePause(); return; }
  if (phase === "over" || phase === "paused") { start(); return; }
  turn(Math.abs(dx) > Math.abs(dy)
    ? (dx > 0 ? "right" : "left")
    : (dy > 0 ? "down" : "up"));
});

newGame();
phase = "idle";
showOverlay("SNAKE II", "Eat the dots.<br />Don't bite yourself.", "PRESS OK / SPACE");
requestAnimationFrame(loop);
</script>
</body>
</html>
