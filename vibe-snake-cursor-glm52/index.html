<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vibe Snake 3310 - GLM 5.2 Edition</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Vibe Snake 3310 — GLM 5.2 Edition</h1>

  <div class="phone-frame">
    <div class="screen-area">
      <div class="hud">
        <span id="score">SCORE 0</span>
        <span id="high">HI 0</span>
      </div>
      <div class="canvas-wrap">
        <canvas id="game" width="168" height="144"></canvas>
        <div class="overlay" id="overlay">
          <div class="big">VIBE SNAKE</div>
          <div>Tap / Press 5<br>to start</div>
          <div class="small">Swipe, Arrows or 2 4 6 8</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    High score saved in <span>localStorage</span> · Vanilla JS · No frameworks
  </div>

<script src="game.js"></script>
</body>
</html>
